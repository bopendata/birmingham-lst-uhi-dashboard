<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
    html, body {
        width:100%;
        height:100%;
        margin:0;
        padding:0;
        background:#fff;
    }

    #map {
        width:100%;
        height:100%;
    }

    .ol-control > * {
        background-color: #f8f8f8!important;
        color: #444!important;
        border-radius: 0px;
    }

    .ol-control {
        background-color: rgba(255,255,255,.4)!important;
        padding: 2px!important;
    }

    .ol-attribution a {
        color: #444!important;
    }

    /* CONTROL PANEL */
    #mapControls{
        position:absolute;
        top:10px;
        right:10px;
        z-index:9999;
        background:white;
        padding:12px;
        border:1px solid #999;
        border-radius:5px;
        font-family:Arial;
        min-width:180px;
        box-shadow:0 2px 5px rgba(0,0,0,0.3);
    }

    #monthLabel{
        margin-top:5px;
        font-weight:bold;
    }

    #monthSlider{
        width:100%;
    }

    /* =========================
       LEGEND (CUSTOM TURBO)
    ========================= */

    #legend {
        position:absolute;
        bottom:20px;
        left:20px;
        z-index:9999;
        background:white;
        padding:10px 12px;
        border:1px solid #999;
        border-radius:6px;
        font-family:Arial;
        box-shadow:0 2px 5px rgba(0,0,0,0.3);
        width:240px;
    }

    #legend h4 {
        margin:0 0 8px 0;
        font-size:14px;
    }

    .gradient-bar {
        height: 18px;
        width: 100%;
        border: 1px solid #333;

        /* ✅ YOUR REQUESTED GRADIENT */
        background: linear-gradient(to right,
            #3b0f70,  /* purple */
            #4145ab,  /* blue */
            #2c7bb6,  /* blue-cyan */
            #00a6ca,  /* cyan */
            #00ccbc,  /* cyan-green */
            #90eb9d,  /* green */
            #ffff8c,  /* yellow */
            #f9d057,  /* yellow-orange */
            #f29e2e,  /* orange */
            #e76818,  /* deep orange */
            #d7191c   /* red */
        );
    }

    .legend-labels {
        display:flex;
        justify-content:space-between;
        font-size:12px;
        margin-top:5px;
    }
    </style>

    <title>UHI / LST Viewer</title>
</head>

<body>

<!-- CONTROL PANEL -->
<div id="mapControls">

    <h4>Variable</h4>

    <label>
        <input type="radio" name="datatype" value="LST" checked>
        LST
    </label>

    <br>

    <label>
        <input type="radio" name="datatype" value="UHI">
        UHI
    </label>

    <hr>

    <h4>Year</h4>

    <label>
        <input type="radio" name="year" value="2025" checked>
        2025
    </label>

    <hr>

    <h4>Month</h4>

    <input type="range" id="monthSlider" min="0" max="11" value="0">
    <div id="monthLabel">Jan</div>

</div>

<!-- LEGEND -->
<div id="legend"></div>

<!-- MAP -->
<div id="map">
    <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
    </div>
</div>

<!-- LIBS -->
<script src="resources/qgis2web_expressions.js"></script>
<script src="./resources/functions.js"></script>
<script src="./resources/ol.js"></script>
<script src="./resources/ol-layerswitcher.js"></script>

<script src="layers/Jefferson_county_24.js"></script>
<script src="layers/Shelby_county_25.js"></script>

<script src="styles/Jefferson_county_24_style.js"></script>
<script src="styles/Shelby_county_25_style.js"></script>

<script src="./layers/layers.js"></script>
<script src="./resources/Autolinker.min.js"></script>
<script src="./resources/qgis2web.js"></script>

<script>

/* =========================
   STATE
========================= */

let currentYear = '2025';
let currentVariable = 'LST';
let currentMonth = 'Jan';

const months = [
    'Jan','Feb','Mar','Apr',
    'May','Jun','Jul','Aug',
    'Sep','Oct','Nov','Dec'
];

/* =========================
   BASEMAP
========================= */

window.onload = function () {

    setTimeout(() => {

        if (!window.map) return;

        var osmBase = new ol.layer.Tile({
            title: "OpenStreetMap",
            type: "base",
            visible: true,
            source: new ol.source.OSM()
        });

        map.getLayers().insertAt(0, osmBase);

        updateLayers();
        updateLegend();

    }, 1500);
};

/* =========================
   LAYERS (UNCHANGED)
========================= */

function updateLayers() {

    if (!window.map) return;

    map.getLayers().forEach(layer => {

        const title = layer.get('title');
        if (!title) return;

        if (title.includes("OpenStreetMap")) return;

        if (title.includes("Jefferson") || title.includes("Shelby")) {
            layer.setVisible(true);
            return;
        }

        layer.setVisible(false);
    });

    map.getLayers().forEach(layer => {

        const title = layer.get('title');
        if (!title) return;

        if (
            title.includes(currentYear) &&
            title.includes(currentVariable) &&
            title.includes(currentMonth)
        ) {
            layer.setVisible(true);
            layer.setOpacity(0.5);
        }
    });
};

/* =========================
   LEGEND UPDATE
========================= */

function updateLegend() {

    document.getElementById("legend").innerHTML = `
        <h4>${currentVariable} Legend</h4>

        <div class="gradient-bar"></div>

        <div class="legend-labels">
            <span>Low</span>
            <span>High</span>
        </div>
    `;
}

/* =========================
   CONTROLS
========================= */

document.querySelectorAll('input[name="datatype"]').forEach(radio => {
    radio.addEventListener('change', function () {
        currentVariable = this.value;
        updateLayers();
        updateLegend();
    });
});

document.querySelectorAll('input[name="year"]').forEach(radio => {
    radio.addEventListener('change', function () {
        currentYear = this.value;
        updateLayers();
    });
});

document.getElementById('monthSlider')
.addEventListener('input', function () {
    currentMonth = months[this.value];
    document.getElementById('monthLabel').innerText = currentMonth;
    updateLayers();
});

</script>

</body>
</html>
